[workspace]
resolver = "2"
members = ["crates/gridlock-core", "crates/gridlock-bus", "crates/gridlock-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
gridlock-core = { path = "crates/gridlock-core" }
gridlock-bus = { path = "crates/gridlock-bus" }

[workspace.lints.rust]
unsafe_code = "forbid"
